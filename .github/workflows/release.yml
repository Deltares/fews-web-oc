name: Upload assets on new release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: /
            asset_name: deltares-fews-weboc
            build_script: build
          - base: /weboc/
            asset_name: deltares-fews-weboc-weboc
            build_script: build
          - base: /
            asset_name: deltares-fews-weboc-standalone
            build_script: build:standalone
          - base: /weboc/
            asset_name: deltares-fews-weboc-weboc-standalone
            build_script: build:standalone
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run patch-package

      - name: Build application
        run: npm run "${{ matrix.build_script }}" -- --base="${{ matrix.base }}" --outDir=dist
      - name: Package build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: zip -r "$ASSET_NAME-$RELEASE_TAG.zip" dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-${{ github.event.release.tag_name }}
          path: ./${{ matrix.asset_name }}-${{ github.event.release.tag_name }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: gh release upload "$RELEASE_TAG" "./$ASSET_NAME-$RELEASE_TAG.zip" --clobber
